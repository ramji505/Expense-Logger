replicaCount: 2

image:
  repository: ramji55/expense-logger-app
  pullPolicy: IfNotPresent
  tag: "4f90d53"

service:
  type: NodePort
  port: 80
  targetPort: 3000
  nodePort: 30080

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

env:
  PORT: 3000
  DB_HOST: "expense-logger-db"
  DB_PORT: 3306
  DB_USER: "expense_user"
  DB_PASSWORD: "expense_password"
  DB_NAME: "expense_logger_db"
